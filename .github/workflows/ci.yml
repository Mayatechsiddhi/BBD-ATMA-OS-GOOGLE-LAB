name: Foundation validation
on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, MIT
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, MIT
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run licenses:inventory
      - run: git diff --exit-code -- docs/dependency-licenses.json
      - run: npm rebuild esbuild
      - run: node scripts/init-dev.mjs
      - run: docker compose -p bbd-atma-dev up -d --wait
      - run: npm run db:runtime:local
      - run: npm run db:generate:wasm
      - run: npm run db:workforce:generate
      - run: npm run db:migrate:wasm
      - run: npm run db:migrate:wasm
      - run: npm run db:runtime:local
      - run: npm run db:test:prepare
      - run: npm run db:workforce:test:prepare
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:privileges
      - run: npm run test:integration
      - run: npm run test:workforce
      - run: npm run test:migrations
      - run: npm run test:migrations:fresh
      - run: npm run test:pooler
      - run: npm run test:workforce:pooler
      - run: npm run build
      - run: npm run test:auth-proxy
      - name: Test actual Next.js requests and Server Actions
        shell: bash
        run: |
          npm run dev > /tmp/bbd-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:3000/api/health
          npm run test:http
          # Compile GET route modules before timed browser interactions. These
          # unauthenticated synthetic paths persist nothing. Include recovery
          # forms first loaded by the no-JavaScript checks. Assertions and all
          # mutation/navigation deadlines remain unchanged.
          for path in /sign-in /sign-up /forgot-password "/reset-password?token=fixture-only" /invitations /organizations/synthetic-warmup/clinic /organizations/synthetic-warmup/clinic/leads /organizations/synthetic-warmup/clinic/leads/synthetic-lead /organizations/synthetic-warmup/clinic/appointments /organizations/synthetic-warmup/clinic/follow-ups /organizations/synthetic-warmup/clinic/reception /display/synthetic-warmup; do
            curl --fail --silent --output /dev/null "http://localhost:3000$path"
          done
          # Compile the SSE handler without opening a stream or granting access.
          # Anonymous callers must still be rejected before any tenant lookup.
          calling_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'http://localhost:3000/api/organizations/synthetic-warmup/calling?view=reception')"
          test "$calling_status" = 401
          browser_path="$(command -v chromium || command -v google-chrome || true)"
          if [[ -z "$browser_path" ]]; then
            echo "::error::Chromium/Chrome is required; browser tests were not run."
            exit 1
          fi
          BROWSER_SERVER_LOG=/tmp/bbd-next.log CHROMIUM_PATH="$browser_path" npm run test:browser
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Stop local test services (preserve volumes)
        if: always()
        run: docker compose -p bbd-atma-dev stop
